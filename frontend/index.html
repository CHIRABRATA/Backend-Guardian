<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backend Guardian — Case File</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0c0e11;
    --surface: #14171c;
    --surface-2: #1a1e25;
    --line: #262b33;
    --line-soft: #1c2129;
    --ink: #e7e9ec;
    --ink-dim: #8b93a1;
    --ink-faint: #565d68;
    --amber: #d98e3f;
    --amber-soft: rgba(217, 142, 63, 0.14);
    --red: #d6534a;
    --red-soft: rgba(214, 83, 74, 0.14);
    --teal: #3aab97;
    --teal-soft: rgba(58, 171, 151, 0.14);
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    background-image:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(217, 142, 63, 0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(58, 171, 151, 0.04), transparent 60%);
  }

  ::selection { background: rgba(217, 142, 63, 0.3); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ---------- Header ---------- */

  .header {
    border-bottom: 1px solid var(--line-soft);
  }

  .seal {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .brand-title {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 21px;
    color: #fff;
  }

  .brand-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .case-no {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 9px;
  }

  .radar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(58, 171, 151, 0.9) 18deg, transparent 45deg);
    animation: radarSpin 2.4s linear infinite;
  }

  .radar::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--bg);
  }

  @keyframes radarSpin {
    to { transform: rotate(360deg); }
  }

  /* ---------- Panels ---------- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
  }

  /* ---------- Form ---------- */

  .field-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
  }

  .field-input, .field-textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 8px 2px;
    resize: none;
    transition: border-color 0.15s ease;
  }

  .field-input:focus, .field-textarea:focus {
    outline: none;
    border-bottom-color: var(--amber);
  }

  .field-hint {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  .btn-run {
    width: 100%;
    background: var(--amber);
    color: #1a1206;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 12px 16px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-run:hover:not(:disabled) { background: #eba455; }
  .btn-run:active:not(:disabled) { transform: scale(0.98); }
  .btn-run:disabled { background: var(--surface-2); color: var(--ink-faint); cursor: not-allowed; }

  .spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #1a1206;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .spinner-light {
    border: 2px solid var(--line);
    border-top-color: var(--amber);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Memory ledger (sidebar history) ---------- */

  .history-card {
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 9px 11px;
  }

  .history-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
  }

  /* ---------- Empty state ---------- */

  .empty-folder {
    width: 56px;
    height: 44px;
    margin: 0 auto 16px;
    opacity: 0.5;
  }

  /* ---------- Case log (loading ledger) ---------- */

  .ledger-item {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-dim);
    display: flex;
    gap: 12px;
    padding: 7px 0;
    opacity: 0;
    animation: ledgerFade 0.4s ease forwards;
    border-bottom: 1px solid var(--line-soft);
  }

  .ledger-item:last-child { border-bottom: none; }

  .ledger-time {
    color: var(--ink-faint);
    flex-shrink: 0;
    width: 46px;
  }

  @keyframes ledgerFade {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Stamp ---------- */

  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-2deg);
    animation: stampIn 0.35s cubic-bezier(.2,1.4,.4,1);
    position: relative;
  }

  .stamp::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px dashed currentColor;
    border-radius: 2px;
    opacity: 0.5;
  }

  @keyframes stampIn {
    from { opacity: 0; transform: rotate(-2deg) scale(1.4); }
    to { opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  .stamp--red { color: var(--red); background: var(--red-soft); }
  .stamp--amber { color: var(--amber); background: var(--amber-soft); }
  .stamp--teal { color: var(--teal); background: var(--teal-soft); }

  /* ---------- Exhibits ---------- */

  .exhibit {
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 12px 14px;
  }

  .exhibit-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 5px;
  }

  /* ---------- Confidence bar (mono ascii-style) ---------- */

  .conf-bar {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: -1px;
  }

  /* ---------- Diff block ---------- */

  .diff-block {
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre-wrap;
  }

  .diff-add { color: var(--teal); }
  .diff-del { color: var(--red); }
  .diff-ctx { color: var(--ink-dim); }

  /* ---------- Sign-off bar ---------- */

  .signoff {
    background: var(--amber-soft);
    border: 1px solid rgba(217, 142, 63, 0.35);
    border-radius: 5px;
  }

  .btn-approve {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 4px;
    border: 1px solid var(--teal);
    color: var(--teal);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-approve:hover:not(:disabled) { background: var(--teal); color: #06201a; }

  .btn-reject {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-reject:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }

  .btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Section divider ---------- */

  .divider-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .divider-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line-soft);
  }
</style>
</head>
<body class="min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API_BASE = "http://127.0.0.1:8000";

function Seal() {
  return (
    <svg className="seal" viewBox="0 0 40 40" fill="none">
      <path d="M20 4L34 9V19C34 27.5 28 33.5 20 36C12 33.5 6 27.5 6 19V9L20 4Z"
        stroke="#d98e3f" strokeWidth="1.4" fill="rgba(217,142,63,0.06)" />
      <path d="M14 19.5L18 23.5L26 14.5" stroke="#3aab97" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function EmptyFolder() {
  return (
    <svg className="empty-folder" viewBox="0 0 56 44" fill="none">
      <path d="M2 10C2 8 3.5 6.5 5.5 6.5H20L24 11H50.5C52.5 11 54 12.5 54 14.5V37.5C54 39.5 52.5 41 50.5 41H5.5C3.5 41 2 39.5 2 37.5V10Z"
        stroke="#8b93a1" strokeWidth="1.4" strokeDasharray="3 3" />
    </svg>
  );
}

function confidenceBar(confidence) {
  const filled = Math.round((confidence || 0) * 12);
  return "█".repeat(filled) + "░".repeat(12 - filled);
}

function riskStampClass(risk) {
  const r = (risk || "").toUpperCase();
  if (r === "HIGH") return "stamp--red";
  if (r === "LOW") return "stamp--teal";
  return "stamp--amber";
}

function renderDiff(fix) {
  if (!fix) return null;
  return fix.split("\n").map((line, i) => {
    let cls = "diff-ctx";
    if (/^\+(?!\+\+)/.test(line)) cls = "diff-add";
    else if (/^-(?!--)/.test(line)) cls = "diff-del";
    return <div key={i} className={cls}>{line || "\u00A0"}</div>;
  });
}

function App() {
  const [repoUrl, setRepoUrl] = useState("");
  const [problem, setProblem] = useState(
    "Two users can book the same seat simultaneously. Investigate and plan a fix."
  );
  const [loading, setLoading] = useState(false);
  const [investigation, setInvestigation] = useState(null);
  const [approvalLoading, setApprovalLoading] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [history, setHistory] = useState([]);
  const [caseNo] = useState(() => String(Math.floor(1000 + Math.random() * 8999)));

  const fetchHistory = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/history`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Failed to load history");
      setHistory(Array.isArray(data) ? data : data.history || []);
    } catch (err) {
      console.error("Failed to load history", err);
    }
  };

  useEffect(() => { fetchHistory(); }, []);

  const handleInvestigate = async (e) => {
    e.preventDefault();
    setLoading(true);
    setInvestigation(null);
    setTestResult(null);

    try {
      const res = await fetch(`${API_BASE}/api/investigate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ problem, repo_url: repoUrl || null })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Investigation failed");
      setInvestigation(data);
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleApproval = async (approved) => {
    if (!investigation) return;
    setApprovalLoading(true);

    try {
      const res = await fetch(`${API_BASE}/api/approve`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: investigation.session_id, approved })
      });
      const data = await res.json();
      setTestResult(data);
      fetchHistory();
    } catch (err) {
      alert("Approval error: " + err.message);
    } finally {
      setApprovalLoading(false);
    }
  };

  const steps = [
    { time: "00:00", label: "case intake recorded" },
    { time: "00:02", label: "memory database queried for prior cases" },
    { time: "00:05", label: "repository cloned, files & call graph indexed" },
    { time: "00:11", label: "root cause isolated, patch drafted" },
  ];

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">

      <header className="header flex items-center justify-between pb-5 mb-8">
        <div className="flex items-center gap-3">
          <Seal />
          <div>
            <h1 className="brand-title">Backend Guardian</h1>
            <p className="brand-sub">Autonomous debugging &amp; supervised repair</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <span className="case-no">CASE No. {caseNo}</span>
          <div className="radar" title="Agents watching"></div>
        </div>
      </header>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

        {/* Left: intake + memory */}
        <div className="lg:col-span-1 space-y-6">
          <div className="panel p-5">
            <h2 className="panel-title mb-4">Open a case</h2>
            <form onSubmit={handleInvestigate} className="space-y-5">
              <div>
                <label className="field-label">Repository URL</label>
                <input
                  type="text"
                  required
                  placeholder="https://github.com/owner/repo.git"
                  value={repoUrl}
                  onChange={(e) => setRepoUrl(e.target.value)}
                  className="field-input"
                />
                <p className="field-hint mt-1.5">Public repo link, or type "local" for the mock repo.</p>
              </div>

              <div>
                <label className="field-label">What's going wrong</label>
                <textarea
                  rows="4"
                  value={problem}
                  onChange={(e) => setProblem(e.target.value)}
                  className="field-textarea"
                ></textarea>
              </div>

              <button type="submit" disabled={loading} className="btn-run">
                {loading ? (
                  <>
                    <span className="spinner"></span>
                    Investigating…
                  </>
                ) : (
                  "Open case & investigate"
                )}
              </button>
            </form>
          </div>

          <div className="panel p-5">
            <h3 className="panel-title mb-3">Prior cases on file</h3>
            {history.length === 0 ? (
              <p className="field-hint">Nothing closed yet — solved cases will index here.</p>
            ) : (
              <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                {history.map((item) => (
                  <div key={item.id} className="history-card">
                    <div className="flex justify-between items-center mb-1">
                      <span className="history-tag" style={{ color: "var(--amber)" }}>Case #{item.id}</span>
                      <span className="history-tag" style={{ color: "var(--teal)" }}>{item.test_status}</span>
                    </div>
                    <p className="text-xs text-slate-300" style={{ color: "var(--ink-dim)" }}>
                      {item.problem}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Right: case file */}
        <div className="lg:col-span-2 space-y-6">

          {!investigation && !loading && (
            <div className="panel p-14 text-center" style={{ borderStyle: "dashed" }}>
              <EmptyFolder />
              <p className="field-label" style={{ color: "var(--ink-dim)" }}>No case open</p>
              <p className="field-hint mt-1">File a report on the left to start an investigation.</p>
            </div>
          )}

          {loading && (
            <div className="panel p-7">
              <div className="flex items-center gap-3 mb-5">
                <span className="spinner spinner-light"></span>
                <h3 className="brand-title" style={{ fontSize: "16px" }}>Agents working the case</h3>
              </div>
              <div>
                {steps.map((s, i) => (
                  <div className="ledger-item" key={i} style={{ animationDelay: `${i * 0.25}s` }}>
                    <span className="ledger-time">{s.time}</span>
                    <span>{s.label}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {investigation && (
            <div className="panel p-7 space-y-6">

              <div className="flex items-start justify-between pb-5" style={{ borderBottom: "1px solid var(--line-soft)" }}>
                <div>
                  <p className="panel-title mb-1">Diagnosis complete</p>
                  <h3 className="brand-title" style={{ fontSize: "19px" }}>Root cause &amp; proposed repair</h3>
                </div>
                <span className={`stamp ${riskStampClass(investigation.risk_level)}`}>
                  {investigation.risk_level} risk
                </span>
              </div>

              <div className="conf-bar" style={{ color: "var(--ink-dim)" }}>
                {confidenceBar(investigation.confidence)}
                <span className="ml-2" style={{ color: "var(--ink)" }}>
                  {(investigation.confidence * 100).toFixed(0)}% confidence
                </span>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div className="exhibit">
                  <span className="exhibit-label">Files touched</span>
                  <span className="font-mono text-xs" style={{ color: "var(--ink)" }}>
                    {investigation.affected_files.join(", ")}
                  </span>
                </div>
                <div className="exhibit">
                  <span className="exhibit-label">Evidence found</span>
                  <span className="text-xs" style={{ color: "var(--ink-dim)" }}>
                    {investigation.evidence}
                  </span>
                </div>
              </div>

              <div>
                <span className="divider-label mb-2">Root cause</span>
                <p className="exhibit text-sm leading-relaxed" style={{ color: "var(--ink)" }}>
                  {investigation.root_cause}
                </p>
              </div>

              <div>
                <span className="divider-label mb-2">Proposed patch</span>
                <div className="diff-block">
                  {renderDiff(investigation.proposed_fix)}
                </div>
              </div>

              {!testResult && (
                <div className="signoff p-4 flex items-center justify-between gap-4">
                  <div>
                    <p className="field-label" style={{ color: "var(--amber)" }}>Sign-off required</p>
                    <p className="field-hint mt-1">Review the patch above before it touches the database layer.</p>
                  </div>
                  <div className="flex gap-2 flex-shrink-0">
                    <button onClick={() => handleApproval(false)} disabled={approvalLoading} className="btn-reject">
                      Reject
                    </button>
                    <button onClick={() => handleApproval(true)} disabled={approvalLoading} className="btn-approve">
                      {approvalLoading ? "Applying…" : "Approve & apply"}
                    </button>
                  </div>
                </div>
              )}

              {testResult && (
                <div className="space-y-3 pt-1">
                  <div className="flex items-center justify-between p-4 exhibit">
                    <div className="flex items-center gap-3">
                      <span className={`stamp ${
                        testResult.test_status === "PASSED" ? "stamp--teal" :
                        testResult.test_status === "SKIPPED" ? "stamp--amber" : "stamp--red"
                      }`}>
                        {testResult.test_status === "PASSED" ? "Verified" :
                         testResult.test_status === "SKIPPED" ? "Skipped" : "Failed"}
                      </span>
                      <p className="field-hint">
                        {testResult.test_status === "PASSED"
                          ? "Tests pass. Patch indexed to the case ledger."
                          : testResult.test_status === "SKIPPED"
                          ? "No test suite found — patch applied without automated checks."
                          : "Tests failed under load."}
                      </p>
                    </div>
                    <span className="history-tag" style={{ color: "var(--ink-faint)" }}>{testResult.status}</span>
                  </div>

                  {testResult.test_output && (
                    <div>
                      <span className="divider-label mb-2">Execution log</span>
                      <div className="diff-block" style={{ color: "var(--ink-dim)" }}>
                        {testResult.test_output}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
